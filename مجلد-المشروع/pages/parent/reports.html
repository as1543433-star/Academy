<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A4F">
<title>التقارير — منصة التعليم الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body data-role="parent" data-page="reports">
<div id="page">
<style>
.rep{padding:16px 0;border-bottom:1px dashed var(--line)}
.rep:last-child{border:0}
.rep h3{margin:0 0 10px;display:flex;align-items:center;gap:10px}
.rep .av{width:40px;height:40px;flex:none;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:19px}
.rrow{display:flex;justify-content:space-between;padding:6px 0;color:var(--ink)}
.rrow span:last-child{color:var(--muted)}
</style>
<div class="ph"><h1 class="pt">التقارير</h1><p>ملخص أداء أبنائك</p></div>

<div class="panel" id="nodata" hidden style="margin-top:16px">
  <p>مفيش حساب ولي أمر مسجّل على الجهاز ده.</p>
  <a href="../../welcome.html"><b>سجّل من هنا</b></a>
</div>

<div class="panel" style="margin-top:16px" id="box"></div>
</div>

<script src="../../assets/js/store.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var m=AcadStore.me();
  if(!m||m.role!=='parent'){$('nodata').hidden=false;$('box').hidden=true;return}
  var kids=AcadStore.children(m.id);
  $('box').innerHTML=kids.length
    ?kids.map(function(s){
      return '<div class="rep"><h3><span class="av">'+esc(s.name.trim().charAt(0))+'</span>'+esc(s.name)+'</h3>'
        +'<div class="rrow"><span>نسبة الحضور</span><span>لا توجد بيانات بعد</span></div>'
        +'<div class="rrow"><span>الدرجات</span><span>لا توجد بيانات بعد</span></div>'
        +'<div class="rrow"><span>التكليفات</span><span>لا توجد بيانات بعد</span></div></div>';
    }).join('')
    :'<p class="sub">اربط ابنك الأول من صفحة <a href="children.html"><b>أبنائي</b></a> علشان تظهر تقاريره</p>';
})();
</script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/pages.js"></script>
</body>
</html>
