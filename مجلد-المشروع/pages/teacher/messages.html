<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A4F">
<title>الرسائل — بوابة المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body data-role="teacher" data-page="messages">
<div id="page">
<style>
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-top:16px}
.mtabs{display:flex;gap:8px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.mtabs button{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:30px;background:var(--mint);border:1px solid var(--line);font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.mtabs button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.mtabs .av{width:30px;height:30px;border-radius:50%;background:var(--pine-2);color:#fff;display:grid;place-items:center;font-family:var(--serif)}
.mtabs button.on .av{background:rgba(255,255,255,.22)}
.thread{height:340px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--mint)}
.bub{max-width:82%;padding:9px 13px 6px;border-radius:18px 18px 18px 5px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;line-height:1.7}
.bub.me{align-self:flex-end;background:var(--pine-2);color:#fff;border-color:transparent;border-radius:18px 18px 5px 18px}
.bub .tm{display:block;text-align:end;font-size:11px;opacity:.6}
.cp{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.cp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--mint);color:var(--ink);border-radius:26px;padding:11px 16px;font:inherit;outline:0}
.cp input:focus{border-color:var(--pine-2)}
.cp button{border:0;border-radius:26px;padding:0 22px;background:var(--amber);color:#1b1304;font:inherit;font-weight:600;cursor:pointer}
</style>
<div class="ph"><h1 class="pt">الرسائل</h1><p>تواصل مع طلابك وإدارة المنصة</p></div>
<div class="mbox">
  <div class="mtabs" id="tabs"></div>
  <div class="thread" id="thread"></div>
  <form class="cp" id="form"><input id="txt" placeholder="اكتب رسالتك..." autocomplete="off"><button type="submit">إرسال</button></form>
</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var C=[
    {n:'إدارة المنصة',m:[['أهلاً بك، تقدر تتواصل معنا لأي استفسار.',0,'أمس']]},
    {n:'نور الهدى',m:[['السلام عليكم دكتور، ممكن أعرف موعد مراجعة التشريح؟',0,'أمس'],['وعليكم السلام، الخميس الساعة 8 مساءً بإذن الله.',1,'أمس']]},
    {n:'يوسف',m:[['شكراً على الشرح، الكورس مفيد جداً.',0,'الأحد']]}
  ],cur=0;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function draw(){
    $('tabs').innerHTML=C.map(function(c,i){return '<button data-i="'+i+'"'+(i===cur?' class="on"':'')+'><span class="av">'+esc(c.n.replace(/^د\.\s*/,'').charAt(0))+'</span>'+esc(c.n)+'</button>'}).join('');
    $('thread').innerHTML=C[cur].m.map(function(x){return '<div class="bub'+(x[1]?' me':'')+'">'+esc(x[0])+'<span class="tm">'+esc(x[2])+'</span></div>'}).join('');
    $('thread').scrollTop=1e6;
    if(window.__shell)__shell.walk();
  }
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){cur=+b.dataset.i;draw()}});
  $('form').addEventListener('submit',function(e){
    e.preventDefault();var v=$('txt').value.trim();if(!v)return;
    C[cur].m.push([v,1,'الآن']);$('txt').value='';draw();
  });
  draw();
})();
</script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/pages.js"></script>
</body>
</html>
