<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A4F">
<title>البث المباشر — بوابة المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
<link rel="stylesheet" href="../../assets/css/market.css">
</head>
<body data-role="teacher" data-page="live">
<div id="page">
<style>
.cin{width:100%;border:1px solid var(--line);background:var(--mint);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;outline:0;margin-bottom:10px}
.cin:focus{border-color:var(--pine-2)}
.cbtn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--pine);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.del{margin-inline-start:auto;border:1.5px solid #e7c4c1;color:#b3261e;background:transparent;border-radius:12px;padding:6px 12px;font:inherit;cursor:pointer}
.msg{min-height:22px;margin-top:8px;color:#b3261e;font-size:14px}
</style>
<div class="ph"><h1 class="pt">البث المباشر</h1><p>جدول جلساتك المباشرة</p></div>
<div class="grid" style="margin-top:22px">
<section><h2>الجلسات القادمة</h2><div class="panel" id="list"></div></section>
<section><h2>جدولة جلسة جديدة</h2><div class="panel">
  <input class="cin" id="lt" placeholder="عنوان الجلسة">
  <select class="cin" id="ld"><option>السبت</option><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option></select>
  <input class="cin" id="ltm" type="time" value="20:00">
  <button class="cbtn" id="add">جدولة الجلسة</button>
  <div class="msg" id="msg"></div>
</div></section>
</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},K='acad_tlive';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var L;try{L=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!Array.isArray(L)||L.length&&typeof L[0]!=='object')L=[{t:'مراجعة التشريح العملي',d:'الخميس',h:'20:00'},{t:'أسئلة وأجوبة قبل الامتحان',d:'الأحد',h:'21:00'}];
  function save(){try{localStorage.setItem(K,JSON.stringify(L))}catch(e){}}
  function draw(){
    $('list').innerHTML=L.length?L.map(function(x,i){return '<div class="lv"><span class="dot"></span><div><b>'+esc(x.t)+'</b><br><small class="sub">'+esc(x.d)+' الساعة '+esc(x.h)+'</small></div><button class="del" data-i="'+i+'">إلغاء</button></div>'}).join(''):'<p class="sub">لا توجد جلسات مجدولة</p>';
    if(window.__shell)__shell.walk();
  }
  $('list').addEventListener('click',function(e){var b=e.target.closest('.del');if(b){L.splice(+b.dataset.i,1);save();draw()}});
  $('add').addEventListener('click',function(){
    var t=$('lt').value.trim();
    if(t.length<3){$('msg').textContent='اكتب عنوان الجلسة (3 حروف على الأقل)';return}
    $('msg').textContent='';L.push({t:t,d:$('ld').value,h:$('ltm').value||'20:00'});save();$('lt').value='';draw();
  });
  save();draw();
})();
</script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/pages.js"></script>
</body>
</html>
