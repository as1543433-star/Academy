<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4A4F">
<title>الرئيسية — بوابة المعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/pages.css">
<link rel="stylesheet" href="../../assets/css/market.css">

<body data-role="teacher" data-page="dashboard">
<div id="page">
<style>
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tbox{background:var(--mint);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.tbox b{display:block;font-family:var(--serif);font-size:30px;color:var(--pine)}
.tlink{display:block;padding:12px 0;border-bottom:1px dashed var(--line);color:var(--ink);text-decoration:none}
.tlink:last-child{border:0}
</style>
<div class="ph"><h1 class="pt">أهلاً بك يا دكتور</h1><p>نظرة سريعة على نشاطك في المنصة</p></div>
<div class="tgrid">
  <div class="tbox"><b id="n1">0</b>طالب مسجّل</div>
  <div class="tbox"><b id="n2">0</b>كورس</div>
  <div class="tbox"><b id="n3">0</b>بث قادم</div>
</div>
<div class="panel" style="margin-top:16px">
  <b>اختصارات</b>
  <a class="tlink" href="courses.html">كورساتي</a>
  <a class="tlink" href="students.html">طلابي</a>
  <a class="tlink" href="live.html">البث المباشر</a>
  <a class="tlink" href="messages.html">الرسائل</a>
</div>
</div>
<script>
(function(){
  var d={};try{d=JSON.parse(localStorage.getItem('acad_db'))||{}}catch(e){}
  document.getElementById('n1').textContent=(d.students||[]).length;
  document.getElementById('n2').textContent=(d.courses||[]).length;
  document.getElementById('n3').textContent=(d.lives||[]).length;
})();
</script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/pages.js"></script>
</body>
</html>
